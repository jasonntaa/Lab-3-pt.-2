<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Responsive Webpage</title>
</head>

<body>
    <div class="content-container">
        <header class="header-container">
            <nav>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#products">Products</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
            <h1>Welcome To My Flower Shop</h1>
        </header>

        <main class="main-container">
            <section id="products" class="product-section">
                <div class="product-card">
                    <h2>Lillies</h2>
                    <img src="./images/download (1).jpeg" alt="lily flower pot">
                    <p>A pot of lillies</p>
                </div>
                <div class="product-card">
                    <h2>Roses</h2>
                    <img src="./images/download (2).jpeg" alt="rose flower pot">
                    <p>A pot of roses</p>
                </div>
                <div class="product-card">
                    <h2>Sunflowers</h2>
                    <img src="./images/download.jpeg" alt="sunflower pot">
                    <p>A pot of sunflowers</p>
                </div>
                <div class="product-card">
                    <h2>Ferns</h2>
                    <img src="./images/images.jpeg" alt="fern pot">
                    <p>A pot of ferns</p>
                </div>
            </section>
        </main>

        <footer id="contact" class="footer-container">
            <p>Contact us at: myflowershop@georgebrowncollege.ca</p>
        </footer>

    </div>
</body>

</html>
